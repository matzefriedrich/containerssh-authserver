services:

  authserver:
    image: mobymatze/containerssh-authserver
    build: 
      context: ../
      dockerfile: Dockerfile
      target: authserver

    restart: on-failure

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AUTHSERVER_CONFIG_PATH: "/var/run/authserver"

    volumes:
      - "./services/authserver/config.yaml:/var/run/authserver/config.yaml:ro"

    deploy:
      replicas: 2

    networks:
      - backend

  nginx-authserver-proxy:
    image: nginx:alpine3.18
    restart: unless-stopped

    volumes:
    - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - authserver

    networks:
      - backend

  containerssh:
    image: containerssh/containerssh:v0.6
    ports:
      - "2222:2222"

    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./services/containerssh/config.yaml:/etc/containerssh/config.yaml:ro
    - ./keys/ssh_host_rsa_key.pem:/var/secrets/ssh_host_rsa_key

    user: "root"
    networks:
      - backend
      - containerssh-control-plane

  postgres-seed:
    image: mobymatze/containerssh-authserver-autosetup
    build: 
      context: ../
      dockerfile: Dockerfile
      target: authserver-autosetup

    environment:
      AUTHSERVER_CONFIG_PATH: "/var/run/authserver"

    volumes:
      - "./services/authserver/config.yaml:/var/run/authserver/config.yaml:ro"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

  postgres:
    image: postgres:16-alpine

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authserver -d authserver"]
      interval: 5s
      timeout: 5s
      retries: 5

    environment:
      POSTGRES_DB: authserver
      POSTGRES_USER: authserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - backend

    ports:
      - "9876:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:

  backend:
    driver: bridge

  containerssh-control-plane:
    driver: bridge

volumes:
  postgres_data:
    driver: local
